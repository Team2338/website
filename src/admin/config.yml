# Use DecapBridge classic auth (required)
backend:
    name: git-gateway
    repo: team2338/website
    branch: main
    identity_url: https://auth.decapbridge.com/sites/2e37641b-73bb-421e-a27c-7c979976d7f3
    gateway_url: https://gateway.decapbridge.com

    # See who did what (optional)
    commit_messages:
        create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
        update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
        delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
        uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
        deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
        openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
media_folder: "src/static/img" # Media files will be stored in the repo under images/uploads
public_folder: "/static/img"
site_url: "https://gearitforward.com"
editor:
    preview: false
collections:
    - name: "setup"
      label: "Setup"
      create: false
      files:
          - name: "setup"
            label: "Setup"
            file: "src/_data/setup.yaml"
            fields:
                - label: "Footer"
                  name: "footer"
                  widget: "object"
                  fields:
                      - label: "Copyright Notice"
                        name: "copyright"
                        widget: "string"
                      - label: "Instagram Link"
                        name: "instagram"
                        widget: "string"
                      - label: "Facebook Link"
                        name: "facebook"
                        widget: "string"
                      - { label: "X Link", name: "x", widget: "string" }
                      - label: "Youtube Link"
                        name: "youtube"
                        widget: "string"
                      - label: "Github Link"
                        name: "github"
                        widget: "string"
                      - link: "Link"
                        name: "link"
                        hint: "This link appears in the right corner of the footer."
                        widget: "object"
                        fields:
                            - label: "Link Text"
                              name: "text"
                              widget: "string"
                            - label: "Link Address"
                              name: "address"
                              widget: "string"
    - name: "pages"
      label: "Pages"
      create: false
      files:
          - label: "Home"
            name: "home"
            file: "src/_data/home.yaml"
            fields:
                - {
                      label: "Full Screen Image",
                      name: "hero_bg",
                      widget: "image",
                  }
                - label: "Section 1"
                  name: "section_1"
                  widget: "object"
                  summary: "{{fields.heading}}"
                  fields:
                      - label: "Heading"
                        name: "heading"
                        widget: "string"
                        hint: "Text wrapped in double asterisks will appear will a orange glow"
                      - label: "Paragraph"
                        name: "paragraph"
                        widget: "markdown"
                        buttons: ["bold", "italic"]
                        editor_components: []
                        hint: "Bold text will appear orange, italics are normal"
                      - label: "Image"
                        name: "img_url"
                        widget: "image"
                      - label: "Image Alt Text"
                        name: "img_alt"
                        widget: "string"
                        hint: This text shows up when the image fails to load and is read to users with vision related disabilities. It should describe what is in the image."
                - label: "Section 2"
                  name: "section_2"
                  summary: "{{fields.heading}}"
                  widget: "object"
                  fields:
                      - label: "Heading"
                        name: "heading"
                        widget: "string"
                        hint: "Text wrapped in double asterisks will appear will a orange glow"
                      - label: "Paragraph"
                        name: "paragraph"
                        widget: "markdown"
                        buttons: ["bold", "italic"]
                        editor_components: []
                        hint: "Bold text will appear orange, italics are normal"
                      - label: "Youtube Embed URL"
                        name: "youtube_url"
                        widget: "string"
                        hint: "This needs to be the embed link. Click share -> embed on youtube. Enable privacy enhanced mode. The link appears in the code where it says src="
                        pattern:
                            ["[nocookie]", "Must a no cookie youtube embed"]
                - label: "Sponsors"
                  name: "sponsors"
                  widget: "list"
                  label_singular: "Sponsor"
                  summary: "{{fields.name}}"
                  fields:
                      - { label: "Name", name: "name", widget: "string" }
                      - { label: "Logo", name: "logo", widget: "image" }
                      - { label: "Link", name: "url", widget: "string" }
          - label: "Resources"
            name: "resources"
            file: "src/_data/resources.yaml"
            fields:
                - { label: "Heading", name: "heading", widget: "string" }
                - { label: "Subheading", name: "subheading", widget: "string" }
                - label: "Categories"
                  name: "categories"
                  widget: "list"
                  label_singular: "Category"
                  summary: "{{fields.name}}"
                  fields:
                      - { label: "Name", name: "name", widget: "string" }
                      - label: "ID"
                        name: "id"
                        widget: "string"
                        hint: "A single word, all lowercase version of the Name"
                        pattern:
                            ["[a-z]", "Must only contain lowercase letters"]
                      - label: "Description"
                        name: "description"
                        widget: "string"
                      - label: "Resources"
                        name: "items"
                        widget: "list"
                        summary: "{{fields.name}}"
                        label_singular: "Resource"
                        fields:
                            - { label: "Name", name: "name", widget: "string" }
                            - label: "Description"
                              name: "description"
                              widget: "string"
                            - { label: "Link", name: "url", widget: "string" }
                            - label: "Icon"
                              name: "icon"
                              widget: "string"
                              required: false
          - label: "Outreach"
            name: "outreach"
            file: "src/_data/outreach.yaml"
            fields:
                - label: "Hero"
                  name: "hero"
                  widget: "object"
                  summary: "{{ fields.heading }}"
                  fields:
                      - label: "Heading"
                        name: "heading"
                        widget: "string"
                        hint: "Text wrapped in asterisks will be orange"
                      - label: "Subheading"
                        name: "subheading"
                        widget: "string"
                      - label: "Background Image"
                        name: "img_url"
                        widget: "image"
                - label: "Section 1"
                  name: "section_1"
                  widget: "object"
                  summary: "{{fields.heading}}"
                  fields:
                      - label: "Heading"
                        name: "heading"
                        widget: "string"
                        hint: "Text wrapped in double asterisks will appear orange"
                      - label: "Paragraph"
                        name: "paragraph"
                        widget: "markdown"
                        buttons: ["bold", "italic"]
                        editor_components: []
                      - label: "Image"
                        name: "img_url"
                        widget: "image"
                      - label: "Image Alt Text"
                        name: "img_alt"
                        widget: "string"
                - label: "Heading"
                  name: "initiatives_heading"
                  widget: "string"
                  hint: "Text wrapped in asterisks will be orange"
                - label: "Initiatives"
                  name: "initiatives"
                  widget: "list"
                  label_singular: "Initiative"
                  summary: "{{fields.name}}"
                  fields:
                      - { label: "Name", name: "name", widget: "string" }
                      - { label: "Image", name: "image", widget: "image" }
                      - label: "Alt Text"
                        name: "alt"
                        widget: "string"
                        hint: "This text shows up when the image fails to load and is read to users with vision related disabilities. It should describe what is in the image."
                      - label: "Description"
                        name: "paragraph"
                        widget: "text"
          - label: "Our Team"
            name: "our_team"
            file: "src/_data/our_team.yaml"
            fields:
                - label: "Header"
                  name: "header"
                  widget: "object"
                  summary: "{{ fields.heading }}"
                  fields:
                      - label: "Heading"
                        name: "heading"
                        widget: "string"
                      - label: "Subheading"
                        name: "subheading"
                        widget: "string"
                - label: "Section 1"
                  name: "section_1"
                  summary: "{{fields.heading}}"
                  widget: "object"
                  fields:
                      - label: "Heading"
                        name: "heading"
                        widget: "string"
                      - label: "Subheading"
                        name: "subheading"
                        widget: "string"
                      - label: "Stats"
                        name: "stats"
                        widget: "list"
                        min: 1
                        max: 4
                        summary: "{{ fields.label }}"
                        fields:
                            - label: "Number"
                              name: "number"
                              widget: "string"
                            - label: "Label"
                              name: "label"
                              widget: "string"
                - label: "Robot Section Heading"
                  name: "robots_heading"
                  widget: "string"
                - label: "Robot Section Subheading"
                  name: "robots_subheading"
                  widget: "string"
                - label: "Robots"
                  name: "robots"
                  widget: "list"
                  label_singular: "Robot"
                  summary: "{{fields.name}} - {{fields.year}}"
                  fields:
                      - { label: "Name", name: "name", widget: "string" }
                      - label: "Year"
                        name: "year"
                        widget: "string"
                        pattern: ["[0-9]", "Must be a number"]
                      - { label: "Image", name: "image", widget: "image" }
                      - label: "Description"
                        name: "description"
                        widget: "string"
                      - label: "Acheivements"
                        name: "achievements"
                        label_singular: "Acheivement"
                        widget: "list"
                        summary: "{{fields.description}}"
                        field:
                            label: "Description"
                            name: "description"
                            widget: string
