hero_bg: /static/img/mv.webp
section_1:
  heading: What is *FIRST* & *FRC*?
  paragraph: "**FIRST** is a global robotics community preparing students for the
    future and is the world's leading youth-serving nonprofit for STEM
    education. __First Robotics Competition__ combines the excitement of sport
    with the rigors of science and technology. Students sometimes refer to it as
    \"the hardest fun you'll ever have.\""
  img_url: /static/img/dsc01047.jpg
  img_alt: "2026 Miami Valley "
section_2:
  heading: "2026"
  paragraph: Our 2026 robot, **Cerberus**, won both the Midwest and Miami Valley
    Regionals and reached a peak ranking of 2nd in Illinois. A triple-laned
    shooter, the robot excelled throughout the REBUILT season, consistently
    performing at a high level in qualification and playoff matches.
  youtube_url: https://www.youtube-nocookie.com/embed/L9y0WqW7Js4?si=mj06YqSfjGExvC52
