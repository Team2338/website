section_1:
    heading: "What is *FIRST* & *FRC*?"
    paragraph: '**FIRST** is a global robotics community preparing students for the future and is the world''s leading youth-serving nonprofit for STEM education. __First Robotics Competition__ combines the excitement of sport with the rigors of science and technology. Students sometimes refer to it as "the hardest fun you''ll ever have."'
    img_url: "/static/img/2023-Comp-Group.jpg"
    img_alt: "2023 Competition Group"
section_2:
    heading: "2025 Season"
    paragraph: "Our 2025 bot, Stringray, won two regionals this year and made it to the division finals at the World Championship"
    youtube_url: "https://www.youtube-nocookie.com/embed/L9y0WqW7Js4?si=mj06YqSfjGExvC52"
